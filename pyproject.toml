[project]
name = "jarvis"
version = "0.1.0"
description = "A free, local-first JARVIS-style personal AI assistant for Windows, powered by Ollama."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Anwin K P" }
]
requires-python = ">=3.12"
keywords = ["assistant", "jarvis", "ollama", "llm", "windows", "voice-assistant", "local-ai"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "comtypes>=1.5.0",
    "ddgs>=9.16.1",
    "faster-whisper>=1.2.1",
    "feedparser>=6.0.14",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "keyring>=25.7.0",
    "loguru>=0.8.0",
    "numpy>=2.5.5",
    "ollama>=0.6.3",
    "openwakeword>=0.6",
    "pillow>=13.0.0",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
    "pycaw>=20260927",
    "pystray>=0.19.5",
    "pyttsx3>=2.99",
    "pywin32>=312",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "screen-brightness-control>=0.27.2",
    "send2trash>=2.2.0",
    "sounddevice>=0.5.6",
    "trafilatura>=2.3.1",
    "webrtcvad-wheels>=2.0.14.post1",
    "win11toast>=0.36.3",
]

[project.urls]
Homepage = "https://github.com/anwin-kp/jarvis-assistant"
Issues = "https://github.com/anwin-kp/jarvis-assistant/issues"

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.uv]
# Smart App Control blocks uv's unsigned Python builds; use the signed python.org install.
python-preference = "only-system"
# Windows-only project: resolve dependencies for Windows only.
environments = ["sys_platform == 'win32'"]
# GPU speech recognition libraries (~1 GB) are installed by default; CI skips them.
default-groups = ["dev", "gpu"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
gpu = [
    "nvidia-cublas-cu12==12.4.5.8 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.1.0.70 ; sys_platform == 'win32'",
]
