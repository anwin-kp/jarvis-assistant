id: window-layout
title: Arrange windows
triggers:
- snap Chrome to the left
- minimize Spotify
- switch to VS Code
- maximize this window
what: Focuses, minimizes, maximizes or snaps a window.
steps:
- window_action(name=<app/window>, action=focus|minimize|maximize|restore|snap_left|snap_right)
- 'unsure of the name: list_windows first'
